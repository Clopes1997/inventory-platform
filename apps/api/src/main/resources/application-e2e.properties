# E2E profile: H2 in-memory so CI can run backend without MySQL/Docker.
# Schema from Flyway (same as MySQL) to avoid drift; H2 MySQL mode runs the same migrations.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# Same auth as dev for E2E login
auth.default.username=inventory
auth.default.password=inventory-test-password
auth.bootstrap.enabled=true
