# MySQL — in dev, if jdbc.url is not set, Dev Services start a container (requires Docker).
# For local MySQL without Docker, set quarkus.datasource.jdbc.url (and username/password) in this file or via env.
# Production: set INVENTORY_DB_URL, INVENTORY_DB_USER, INVENTORY_DB_PASSWORD (never commit real prod secrets).
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=inventory
quarkus.datasource.password=inventory
# Schema managed by Flyway migrations; Hibernate only validates.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
# New target database only. Legacy migration history is deliberately not reused.
quarkus.flyway.locations=db/consolidated
quarkus.flyway.clean-disabled=true
%prod.quarkus.datasource.jdbc.url=${INVENTORY_DB_URL}
%prod.quarkus.datasource.username=${INVENTORY_DB_USER}
%prod.quarkus.datasource.password=${INVENTORY_DB_PASSWORD}

# REST
quarkus.http.port=8080
# CORS — set INVENTORY_CORS_ORIGINS in production (e.g. https://app.example.com)
quarkus.http.cors=${INVENTORY_CORS_ENABLED:false}
quarkus.http.cors.origins=${INVENTORY_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,content-type,authorization

# Auth: override via env (INVENTORY_AUTH_SECRET, INVENTORY_AUTH_USER, INVENTORY_AUTH_PASSWORD).
# JWT secret: default below is for DEV ONLY. In production you MUST set INVENTORY_AUTH_SECRET to a strong random secret (256+ bits for HS256).
auth.jwt.secret=${INVENTORY_AUTH_SECRET}
%dev.auth.jwt.secret=local-development-only-signing-secret-32-bytes-minimum
%test.auth.jwt.secret=isolated-test-signing-secret-32-bytes-minimum
%e2e.auth.jwt.secret=isolated-e2e-signing-secret-32-bytes-minimum
auth.bootstrap.enabled=${INVENTORY_BOOTSTRAP_ADMIN:false}
auth.default.username=${INVENTORY_AUTH_USER:}
auth.default.password=${INVENTORY_AUTH_PASSWORD:}
