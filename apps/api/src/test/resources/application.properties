# H2 in-memory for @QuarkusTest. Schema from Flyway (same as MySQL) to avoid drift.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# Auth (same as dev for ITs)
auth.default.username=inventory
auth.default.password=inventory-test-password
auth.bootstrap.enabled=true
